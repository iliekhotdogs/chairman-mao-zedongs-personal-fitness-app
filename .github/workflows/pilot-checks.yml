name: Pilot checks
on:
  push:
  pull_request:

jobs:
  app-and-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --runInBand
      - run: npx expo export --platform web
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://nmovowhobqeaokzdspfp.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      - name: Web bundle must embed the Supabase URL
        run: grep -rq "nmovowhobqeaokzdspfp.supabase.co" dist/_expo
      - name: Type-check Supabase Edge Functions
        run: deno check supabase/functions/ai/index.ts supabase/functions/admin-stats/index.ts supabase/functions/notify/index.ts
