<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- Expo appends theme-color and description from app.json (expo.web). -->
    <meta name="color-scheme" content="dark" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FitCoach" />
    <meta property="og:title" content="FitCoach: train, eat, get better" />
    <meta property="og:description" content="Photo food logging, adaptive training plans and a coach that asks before it changes anything." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="FitCoach: train, eat, get better" />
    <meta name="twitter:description" content="Photo food logging, adaptive training plans and a coach that asks before it changes anything." />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* Dark background before the app paints, so there is no white flash. */
      html,
      body {
        background-color: #0a0b0d;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run FitCoach.
    </noscript>
    <div id="root"></div>
  </body>
</html>
